[advisories]
version = 2
yanked = "warn"
ignore = [
  # required migrating away from ethers to alloy
  "RUSTSEC-2024-0384", # instant crate
  "RUSTSEC-2025-0009",  # ring AES panic vulnerability
  "RUSTSEC-2025-0010",  # ring unmaintained
  # bundles_rs dependency - waiting for upstream fix
  "RUSTSEC-2023-0071",  # rsa Marvin Attack
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8

allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "MPL-2.0",
  "Zlib",
  "LicenseRef-ring",
  "CDLA-Permissive-2.0",
]

exceptions = [
  { allow = ["CC0-1.0"], name = "tiny-keccak" },
  { allow = ["CC0-1.0"], name = "secp256k1" },
  { allow = ["CC0-1.0"], name = "secp256k1-sys" },
  { allow = ["BSD-2-Clause"], name = "zerocopy" },
]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "LicenseRef-webpki"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
